<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>SCOOP RUNNER</title>
  <meta name="description" content="Endless journalism runner. Chase the story. Beat the deadline." />
  <meta property="og:title" content="SCOOP RUNNER" />
  <meta property="og:description" content="Collect scoops, dodge lawsuits and fake news, beat the deadline." />
  <meta property="og:image" content="assets/og.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SCOOP RUNNER" />
  <meta name="twitter:description" content="Chase the story. Beat the deadline." />
  <meta name="twitter:image" content="assets/x-banner.svg" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="manifest" href="site.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="masthead">
      <div class="kicker">CITY DESK · LIVE</div>
      <h1>SCOOP RUNNER</h1>
      <p class="tag">Chase the story. Beat the deadline.</p>
    </header>
    <canvas id="game" width="390" height="640" aria-label="Scoop Runner game"></canvas>
    <div id="hud">
      <span id="score">SCOOPS 0</span>
      <span id="best">BEST 0</span>
    </div>
    <div id="overlay" class="overlay">
      <h2 id="overlayTitle">SCOOP RUNNER</h2>
      <p id="overlayCopy">Tap or press space to jump. Collect scoops. Dodge lawsuits, fake news, and deadlines.</p>
      <button id="startBtn" type="button">FILE THE STORY</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
