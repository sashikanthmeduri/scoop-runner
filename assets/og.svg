<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Scoop Runner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="55%" stop-color="#12151b"/>
      <stop offset="100%" stop-color="#1a1408"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5b942"/>
      <stop offset="100%" stop-color="#ffd978"/>
    </linearGradient>
    <pattern id="newsprint" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <circle cx="1" cy="1" r="0.6" fill="#e8dcc8" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#newsprint)"/>
  <rect x="0" y="0" width="18" height="630" fill="#f5b942"/>
  <text x="70" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="8" fill="#3ee0d4">BREAKING</text>
  <text x="70" y="230" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="96" fill="url(#amber)">SCOOP RUNNER</text>
  <text x="74" y="286" font-family="Georgia, serif" font-size="28" fill="#e8dcc8">Chase the story. Beat the deadline.</text>
  <g transform="translate(780,170)">
    <rect x="0" y="40" width="320" height="220" rx="8" fill="#e8dcc8"/>
    <rect x="16" y="58" width="288" height="12" fill="#0b0d10" opacity="0.2"/>
    <rect x="16" y="84" width="240" height="8" fill="#0b0d10" opacity="0.15"/>
    <rect x="16" y="106" width="260" height="8" fill="#0b0d10" opacity="0.15"/>
    <rect x="16" y="128" width="200" height="8" fill="#0b0d10" opacity="0.15"/>
    <text x="16" y="200" font-family="Impact, sans-serif" font-size="42" fill="#0b0d10">SCOOP</text>
    <text x="16" y="236" font-family="Georgia, serif" font-size="18" fill="#7a4b00">EXCLUSIVE</text>
  </g>
  <g transform="translate(140,390)" fill="none" stroke="#f5b942" stroke-width="6" stroke-linecap="round">
    <path d="M0 80 L40 40 L80 80 L140 10 L200 90 L260 30 L320 70"/>
    <circle cx="320" cy="70" r="10" fill="#3ee0d4" stroke="none"/>
  </g>
  <text x="70" y="580" font-family="Georgia, serif" font-size="20" fill="#8a8376">Collect scoops · dodge lawsuits · outrun the deadline</text>
</svg>
