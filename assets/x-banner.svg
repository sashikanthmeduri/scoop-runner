<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="Scoop Runner banner">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="100%" stop-color="#1c160a"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#bbg)"/>
  <rect x="0" y="0" width="16" height="500" fill="#f5b942"/>
  <rect x="0" y="0" width="1500" height="8" fill="#3ee0d4"/>
  <text x="80" y="210" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="92" fill="#f5b942">SCOOP RUNNER</text>
  <text x="86" y="268" font-family="Georgia, serif" font-size="28" fill="#e8dcc8">Chase the story. Beat the deadline.</text>
  <g fill="#3ee0d4" font-family="Georgia, serif" font-size="18" letter-spacing="4">
    <text x="86" y="340">SCOOPS</text>
    <text x="220" y="340">DEADLINES</text>
    <text x="400" y="340">BYLINES</text>
  </g>
  <g transform="translate(1080,120)">
    <rect width="280" height="260" rx="10" fill="#e8dcc8"/>
    <text x="24" y="70" font-family="Impact, sans-serif" font-size="36" fill="#0b0d10">LIVE</text>
    <text x="24" y="120" font-family="Georgia, serif" font-size="20" fill="#7a4b00">City desk</text>
    <text x="24" y="180" font-family="Georgia, serif" font-size="16" fill="#0b0d10">The scoop is moving.</text>
    <text x="24" y="208" font-family="Georgia, serif" font-size="16" fill="#0b0d10">Don't miss it.</text>
  </g>
</svg>
